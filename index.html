<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KokiChat</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Vazirmatn',sans-serif;
  background:#0b0a09;
  color:#f3efe4;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(242,181,68,0.10) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(232,103,46,0.08) 0%, transparent 50%);
}

.glass{
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.09);
  border-radius:24px;
}

/* LOGIN */
#login-screen{
  display:flex;flex-direction:column;align-items:center;
  gap:22px;width:100%;max-width:320px;padding:36px 28px;
}
.logo-wrap{
  width:96px;height:96px;
  display:flex;align-items:center;justify-content:center;
}
.logo-wrap img{
  width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 0 28px rgba(242,181,68,0.4));
}
.login-title{font-size:22px;font-weight:700;letter-spacing:-0.5px}
.login-sub{font-size:13px;color:rgba(243,239,228,0.4);text-align:center}

input[type="password"]{
  width:100%;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:12px;
  color:#e8eaf0;
  font-family:'Vazirmatn',sans-serif;
  font-size:20px;
  padding:12px 16px;
  outline:none;
  text-align:center;
  letter-spacing:8px;
  transition:border-color .2s,box-shadow .2s;
  direction:ltr;
}
input[type="password"]:focus{
  border-color:rgba(242,181,68,0.75);
  box-shadow:0 0 0 3px rgba(242,181,68,0.15);
}

.btn-primary{
  width:100%;
  background:linear-gradient(135deg,#f2b544,#e8672e);
  color:#171208;border:none;border-radius:12px;
  font-family:'Vazirmatn',sans-serif;
  font-size:15px;font-weight:600;
  padding:13px;cursor:pointer;
  transition:opacity .2s,transform .1s;
  box-shadow:0 4px 20px rgba(232,103,46,0.4);
}
.btn-primary:hover{opacity:.88}
.btn-primary:active{transform:scale(.98)}

.err{font-size:13px;color:#f87171;text-align:center;min-height:18px}

/* NAME */
#name-screen{
  display:none;flex-direction:column;align-items:center;
  gap:20px;width:100%;max-width:320px;padding:36px 28px;
}
.name-btn{
  width:100%;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;
  color:#e8eaf0;
  font-family:'Vazirmatn',sans-serif;
  font-size:15px;font-weight:500;
  padding:16px;cursor:pointer;
  transition:background .2s,border-color .2s,transform .1s;
  text-align:center;
}
.name-btn:hover{background:rgba(242,181,68,0.15);border-color:rgba(242,181,68,0.4)}
.name-btn:active{transform:scale(.98)}

/* CHAT */
#chat-screen{
  display:none;flex-direction:column;
  width:100%;max-width:580px;height:100dvh;
  background:rgba(11,10,9,0.78);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  border-left:1px solid rgba(255,255,255,0.06);
  border-right:1px solid rgba(255,255,255,0.06);
}

.chat-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;
  background:rgba(242,181,68,0.06);
  border-bottom:1px solid rgba(242,181,68,0.15);
  flex-shrink:0;gap:10px;
}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-logo{width:26px;height:26px;object-fit:contain;flex-shrink:0}
.avatar{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,#f2b544,#e8672e);
  color:#171208;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;flex-shrink:0;
  box-shadow:0 0 12px rgba(232,103,46,0.35);
}
.avatar.b{background:linear-gradient(135deg,#4a4a4d,#6d6d72);color:#f3efe4}
.hdr-info{display:flex;flex-direction:column;gap:1px}
.hdr-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.hdr-status{font-size:11.5px;color:rgba(243,239,228,0.4)}
.hdr-right{display:flex;align-items:center;gap:6px}
.icon-btn{
  background:none;border:none;color:rgba(243,239,228,0.4);
  cursor:pointer;padding:7px;border-radius:9px;font-size:17px;
  transition:color .2s,background .2s;display:flex;align-items:center;
}
.icon-btn:hover{color:#e8eaf0;background:rgba(255,255,255,0.07)}

#messages{
  flex:1;overflow-y:auto;
  padding:16px 14px;
  display:flex;flex-direction:column;gap:4px;
  scroll-behavior:smooth;
}
#messages::-webkit-scrollbar{width:3px}
#messages::-webkit-scrollbar-thumb{background:rgba(242,181,68,0.25);border-radius:3px}

.msg-wrap{display:flex;flex-direction:column;max-width:72%}
.msg-wrap.me{align-self:flex-start;align-items:flex-start}
.msg-wrap.them{align-self:flex-end;align-items:flex-end}

.bubble{
  padding:9px 13px;border-radius:16px;
  font-size:14.5px;line-height:1.65;
  word-break:break-word;white-space:pre-wrap;
}
.msg-wrap.me .bubble{
  background:rgba(242,181,68,0.18);
  border:1px solid rgba(242,181,68,0.32);
  border-bottom-right-radius:4px;
}
.msg-wrap.them .bubble{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-bottom-left-radius:4px;
  backdrop-filter:blur(8px);
}
.msg-meta{font-size:11px;color:rgba(243,239,228,0.28);margin-top:3px;padding:0 3px}

.date-sep{
  align-self:center;font-size:11.5px;
  color:rgba(243,239,228,0.3);
  background:rgba(242,181,68,0.08);
  border:1px solid rgba(242,181,68,0.18);
  border-radius:20px;padding:3px 14px;
  margin:8px 0;
}

.sticker-bubble{
  background:none!important;border:none!important;
  font-size:52px;line-height:1.2;padding:4px 8px!important;
}

.chat-input{
  display:flex;align-items:flex-end;gap:8px;
  padding:10px 12px;
  background:rgba(242,181,68,0.04);
  border-top:1px solid rgba(242,181,68,0.14);
  flex-shrink:0;position:relative;
}

#msg-input{
  flex:1;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;
  color:#e8eaf0;
  font-family:'Vazirmatn',sans-serif;
  font-size:14px;
  padding:10px 13px;
  resize:none;outline:none;
  max-height:110px;overflow-y:auto;
  line-height:1.5;
  transition:border-color .2s;
  direction:rtl;
}
#msg-input:focus{border-color:rgba(242,181,68,0.55)}
#msg-input::placeholder{color:rgba(243,239,228,0.28)}

.send-btn{
  background:linear-gradient(135deg,#f2b544,#e8672e);
  border:none;border-radius:12px;color:#171208;cursor:pointer;
  width:40px;height:40px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;
  box-shadow:0 2px 12px rgba(232,103,46,0.4);
  transition:opacity .2s,transform .1s;
}
.send-btn:hover{opacity:.88}
.send-btn:active{transform:scale(.95)}

#sticker-panel{
  position:absolute;bottom:68px;right:12px;
  background:rgba(11,10,9,0.97);
  backdrop-filter:blur(20px);
  border:1px solid rgba(242,181,68,0.22);
  border-radius:16px;padding:12px;
  display:none;flex-wrap:wrap;gap:6px;
  width:240px;z-index:50;
  box-shadow:0 8px 32px rgba(0,0,0,0.6);
}
#sticker-panel.open{display:flex}
.stk{
  font-size:30px;cursor:pointer;padding:5px;
  border-radius:8px;transition:background .15s,transform .1s;
  line-height:1;
}
.stk:hover{background:rgba(242,181,68,0.16);transform:scale(1.2)}

.dot-online{
  width:8px;height:8px;border-radius:50%;
  background:#22c55e;display:inline-block;
  box-shadow:0 0 6px #22c55e;margin-left:4px;
}

#cfg-modal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.65);
  backdrop-filter:blur(6px);
  z-index:200;align-items:center;justify-content:center;
}
#cfg-modal.open{display:flex}
.modal-box{
  background:rgba(11,10,9,0.98);
  border:1px solid rgba(242,181,68,0.2);
  border-radius:20px;padding:28px 22px;
  width:92%;max-width:360px;
  display:flex;flex-direction:column;gap:14px;
}
.modal-title{font-size:16px;font-weight:700}
.modal-desc{font-size:12.5px;color:rgba(243,239,228,0.4);line-height:1.7}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:rgba(243,239,228,0.4)}
.field input{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;color:#e8eaf0;
  font-family:'Vazirmatn',sans-serif;
  font-size:13px;padding:9px 12px;outline:none;
  transition:border-color .2s;direction:ltr;
}
.field input:focus{border-color:rgba(242,181,68,0.5)}
.modal-btns{display:flex;gap:10px;margin-top:4px}
.btn-cancel{
  flex:1;background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;color:#e8eaf0;
  font-family:'Vazirmatn',sans-serif;
  font-size:14px;padding:10px;cursor:pointer;
}
.btn-cancel:hover{background:rgba(255,255,255,0.09)}
.btn-save{flex:2}

#lightbox{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.9);z-index:300;
  align-items:center;justify-content:center;
}
#lightbox.open{display:flex}
#lightbox img{max-width:92vw;max-height:90vh;border-radius:10px}
#lb-close{
  position:absolute;top:16px;left:16px;
  background:rgba(255,255,255,0.1);border:none;
  color:#e8eaf0;font-size:20px;cursor:pointer;
  border-radius:8px;padding:5px 11px;
}

.n-dot{
  width:9px;height:9px;border-radius:50%;
  background:#e8672e;box-shadow:0 0 8px #e8672e;
  display:none;
}

@media(max-width:580px){
  #chat-screen{border:none}
  .msg-wrap{max-width:82%}
}
</style>
</head>
<body>

<div id="login-screen" class="glass">
  <div class="logo-wrap"><img src="logo.png" alt="KokiChat"></div>
  <div class="login-title">KokiChat</div>
  <div class="login-sub">فضای خصوصی گفتگو</div>
  <input type="password" id="pwd" placeholder="••••••" />
  <div class="err" id="err"></div>
  <button class="btn-primary" id="login-btn">ورود</button>
</div>

<div id="name-screen" class="glass">
  <div class="logo-wrap"><img src="logo.png" alt="KokiChat"></div>
  <div class="login-title">تو کی هستی؟</div>
  <div class="login-sub">یکی رو انتخاب کن</div>
  <button class="name-btn" id="pick-a">🔵 کاربر ۱</button>
  <button class="name-btn" id="pick-b">🟣 کاربر ۲</button>
</div>

<div id="chat-screen">
  <div class="chat-header">
    <div class="hdr-left">
      <div class="avatar" id="my-av">؟</div>
      <div class="hdr-info">
        <div class="hdr-name"><img class="hdr-logo" src="logo.png" alt=""> KokiChat 🔐</div>
        <div class="hdr-status" id="status-txt">در حال اتصال...</div>
      </div>
    </div>
    <div class="hdr-right">
      <div class="n-dot" id="ndot"></div>
      <button class="icon-btn" onclick="openCfg()">⚙️</button>
      <button class="icon-btn" onclick="doLogout()">🚪</button>
    </div>
  </div>

  <div id="messages"></div>

  <div class="chat-input">
    <div id="sticker-panel"></div>
    <button class="icon-btn" onclick="toggleStk()" style="flex-shrink:0;font-size:20px">😊</button>
    <textarea id="msg-input" rows="1" placeholder="پیام بده..."
      onkeydown="onKey(event)" oninput="grow(this)"></textarea>
    <button class="send-btn" onclick="sendMsg()">➤</button>
  </div>
</div>

<div id="cfg-modal">
  <div class="modal-box">
    <div class="modal-title">🔔 اعلان بله</div>
    <div class="modal-desc">توکن ربات بله و Chat ID خودت رو وارد کن. فقط تو مرورگرت ذخیره می‌شه.</div>
    <div class="field">
      <label>توکن ربات بله</label>
      <input type="text" id="cfg-token" placeholder="توکن ربات" />
    </div>
    <div class="field">
      <label>Chat ID بله</label>
      <input type="text" id="cfg-chatid" placeholder="شناسه چت" />
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeCfg()">انصراف</button>
      <button class="btn-primary btn-save" onclick="saveCfg()">ذخیره</button>
    </div>
  </div>
</div>

<div id="lightbox">
  <button id="lb-close" onclick="closeLb()">✕</button>
  <img id="lb-img" src="" />
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// اطلاعات پروژه‌ی Supabase
const SUPABASE_URL      = "https://spliizlxeouevrjrgtwy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_O1-F6Pfaw0Vvm6h9o2tGnw_CbRqOwR9";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const PASSWORD = "kokmal";
const USER_A   = "کاربر ۱";
const USER_B   = "کاربر ۲";

const STICKERS = [
  "😂","😍","🥰","😎","🤣","😭","🙏","👍","❤️","🔥",
  "😅","🤩","😜","🥳","😊","💪","🤦","🙈","💀","✅",
  "🌹","🎉","👏","💯","🫶","😤","🤔","😴","👀","🫠"
];

let me, lastDate, unread = false, stkOpen = false, msgCache = [], heartbeatId;

// stickers
const sp = document.getElementById('sticker-panel');
STICKERS.forEach(s => {
  const b = document.createElement('span');
  b.className = 'stk'; b.textContent = s;
  b.onclick = () => { sendStk(s); toggleStk(false); };
  sp.appendChild(b);
});

// LOGIN
function doLogin() {
  const val = document.getElementById('pwd').value;
  if (val === PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('name-screen').style.display  = 'flex';
  } else {
    const e = document.getElementById('err');
    e.textContent = 'رمز اشتباهه!';
    document.getElementById('pwd').value = '';
    setTimeout(() => e.textContent = '', 2000);
  }
}
document.getElementById('login-btn').onclick = doLogin;
document.getElementById('pwd').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

// NAME
document.getElementById('pick-a').onclick = () => pickName(USER_A);
document.getElementById('pick-b').onclick = () => pickName(USER_B);

function pickName(name) {
  me = name;
  document.getElementById('name-screen').style.display  = 'none';
  document.getElementById('chat-screen').style.display  = 'flex';
  document.getElementById('my-av').textContent = name === USER_A ? 'A' : 'B';
  if(name === USER_B) document.getElementById('my-av').classList.add('b');
  initChat();
}

async function initChat() {
  const other = me === USER_A ? USER_B : USER_A;

  // --- presence ---
  async function pingPresence(online) {
    await supabase.from('presence').upsert({ name: me, online, ts: Date.now() });
  }
  await pingPresence(true);
  heartbeatId = setInterval(() => pingPresence(true), 15000);
  window.addEventListener('beforeunload', () => { navigator.sendBeacon && pingPresence(false); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pingPresence(true); });

  function paintPresence(d) {
    const el = document.getElementById('status-txt');
    if (!d) { el.textContent = `${other} آفلاینه`; return; }
    const fresh = Date.now() - d.ts < 30000;
    if (d.online && fresh) el.innerHTML = `<span class="dot-online"></span> ${other} آنلاینه`;
    else if (d.ts) el.textContent = `${other} — ${ago(d.ts)}`;
    else el.textContent = `${other} آفلاینه`;
  }

  const { data: presRow } = await supabase.from('presence').select('*').eq('name', other).maybeSingle();
  paintPresence(presRow);
  setInterval(async () => {
    const { data } = await supabase.from('presence').select('*').eq('name', other).maybeSingle();
    paintPresence(data);
  }, 10000);

  supabase.channel('presence-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'presence', filter: `name=eq.${other}` },
      payload => paintPresence(payload.new))
    .subscribe();

  // --- messages ---
  const { data: initialMsgs } = await supabase.from('messages').select('*').order('ts', { ascending: true });
  msgCache = initialMsgs || [];
  renderAll(msgCache);

  supabase.channel('messages-changes')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      msgCache.push(payload.new);
      renderAll(msgCache);
    })
    .subscribe();
}

function renderAll(msgs) {
  const c = document.getElementById('messages');
  const atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 80;
  c.innerHTML = ''; lastDate = null;
  [...msgs].sort((a,b) => a.ts - b.ts).forEach(renderOne);
  if (atBottom) c.scrollTop = c.scrollHeight;
}

function renderOne(m) {
  const c = document.getElementById('messages');
  const isMe = m.sender === me;

  if (m.ts) {
    const dk = new Date(m.ts).toDateString();
    if (dk !== lastDate) {
      lastDate = dk;
      const sep = document.createElement('div');
      sep.className = 'date-sep';
      sep.textContent = fmtDate(new Date(m.ts));
      c.appendChild(sep);
    }
  }

  const wrap = document.createElement('div');
  wrap.className = `msg-wrap ${isMe ? 'me' : 'them'}`;

  const bub = document.createElement('div');
  if (m.type === 'sticker') {
    bub.className = 'bubble sticker-bubble';
    bub.textContent = m.text;
  } else if (m.type === 'image') {
    bub.className = 'bubble'; bub.style.padding = '6px';
    const img = document.createElement('img');
    img.src = m.url;
    img.style.cssText = 'max-width:200px;border-radius:10px;display:block;cursor:pointer';
    img.loading = 'lazy';
    img.onclick = () => openLb(m.url);
    bub.appendChild(img);
  } else {
    bub.className = 'bubble';
    bub.textContent = m.text;
  }

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  const t = new Date(m.ts || Date.now());
  const hh = t.getHours().toString().padStart(2,'0');
  const mm = t.getMinutes().toString().padStart(2,'0');
  meta.textContent = (isMe ? '' : m.sender + ' · ') + hh + ':' + mm;

  wrap.appendChild(bub);
  wrap.appendChild(meta);
  c.appendChild(wrap);

  if (!isMe && m.ts && Date.now() - m.ts < 6000 && document.hidden) {
    document.title = '💬 پیام جدید!';
    unread = true;
    document.getElementById('ndot').style.display = 'block';
    sendBale(`💬 پیام از ${m.sender}:\n${m.type==='sticker' ? m.text+' (استیکر)' : (m.text||'').slice(0,80)}`);
  }
}

async function sendMsg() {
  if (!me) return;
  const inp = document.getElementById('msg-input');
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = ''; inp.style.height = 'auto';
  await supabase.from('messages').insert({ sender: me, type: 'text', text: txt, ts: Date.now() });
  if (me === USER_B) sendBale(`💬 پیام:\n${txt.slice(0,100)}`);
}
window.sendMsg = sendMsg;

async function sendStk(s) {
  if (!me) return;
  await supabase.from('messages').insert({ sender: me, type: 'sticker', text: s, ts: Date.now() });
  if (me === USER_B) sendBale(`${s} استیکر`);
}

async function sendBale(text) {
  const cfg = loadCfg();
  if (!cfg?.token || !cfg?.chatId) return;
  try {
    await fetch(`https://tapi.bale.ai/bot${cfg.token}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: cfg.chatId, text })
    });
  } catch(e) { console.warn('Bale fail', e); }
}

function loadCfg() { try { return JSON.parse(localStorage.getItem('koki_bale')||'null'); } catch { return null; } }

window.openCfg = () => {
  const c = loadCfg();
  if (c) { document.getElementById('cfg-token').value = c.token||''; document.getElementById('cfg-chatid').value = c.chatId||''; }
  document.getElementById('cfg-modal').classList.add('open');
};
window.closeCfg = () => document.getElementById('cfg-modal').classList.remove('open');
window.saveCfg = () => {
  localStorage.setItem('koki_bale', JSON.stringify({
    token: document.getElementById('cfg-token').value.trim(),
    chatId: document.getElementById('cfg-chatid').value.trim()
  }));
  closeCfg();
};

window.toggleStk = (force) => {
  stkOpen = force !== undefined ? force : !stkOpen;
  document.getElementById('sticker-panel').classList.toggle('open', stkOpen);
};
document.addEventListener('click', e => {
  if (stkOpen && !e.target.closest('#sticker-panel') && !e.target.closest('.icon-btn')) toggleStk(false);
});

window.onKey  = e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} };
window.grow   = el => { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,110)+'px'; };
window.doLogout = async () => {
  if (!confirm('خروج؟')) return;
  if (heartbeatId) clearInterval(heartbeatId);
  if (me) await supabase.from('presence').upsert({ name: me, online: false, ts: Date.now() });
  location.reload();
};
window.openLb = src => { document.getElementById('lb-img').src=src; document.getElementById('lightbox').classList.add('open'); };
window.closeLb = () => document.getElementById('lightbox').classList.remove('open');
document.getElementById('lightbox').onclick = e => { if(e.target===document.getElementById('lightbox')) closeLb(); };

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && unread) { document.title='KokiChat'; unread=false; document.getElementById('ndot').style.display='none'; }
});

function fmtDate(d) {
  const now = new Date();
  if (d.toDateString()===now.toDateString()) return 'امروز';
  const y = new Date(now); y.setDate(now.getDate()-1);
  if (d.toDateString()===y.toDateString()) return 'دیروز';
  return d.toLocaleDateString('fa-IR');
}
function ago(ts) {
  const s = Date.now()-ts;
  if(s<60000) return 'همین الان';
  if(s<3600000) return Math.floor(s/60000)+' دقیقه پیش';
  if(s<86400000) return Math.floor(s/3600000)+' ساعت پیش';
  return Math.floor(s/86400000)+' روز پیش';
}
