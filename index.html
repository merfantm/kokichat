<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KokiChat</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Vazirmatn',sans-serif;
  background:#050b16;
  color:#f3efe4;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(56,189,248,0.12) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(14,165,233,0.10) 0%, transparent 50%);
}

.glass{
  position:relative;
  background:rgba(255,255,255,0.045);
  backdrop-filter:blur(34px) saturate(140%);
  -webkit-backdrop-filter:blur(34px) saturate(140%);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:24px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.12), 0 20px 60px rgba(0,0,0,0.45);
  overflow:hidden;
}
.glass::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 30%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/></svg>");
  mix-blend-mode:overlay;
}

/* LOGIN */
#login-screen{
  display:flex;flex-direction:column;align-items:center;
  gap:20px;width:100%;max-width:340px;padding:44px 30px 38px;
}
.logo-wrap{
  width:110px;height:110px;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.logo-wrap::before{
  content:'';position:absolute;inset:-18px;border-radius:50%;
  background:radial-gradient(circle, rgba(56,189,248,0.55) 0%, rgba(14,165,233,0.25) 45%, transparent 72%);
  filter:blur(6px);
  animation:orbGlow 3.2s ease-in-out infinite;
  z-index:0;
}
@keyframes orbGlow{
  0%,100%{transform:scale(0.92);opacity:0.75}
  50%{transform:scale(1.08);opacity:1}
}
.logo-wrap img{
  width:100%;height:100%;object-fit:contain;position:relative;z-index:1;
  filter:drop-shadow(0 0 30px rgba(56,189,248,0.55));
}
.login-title{
  font-size:26px;font-weight:700;letter-spacing:-0.5px;
  background:linear-gradient(135deg,#7dd3fc,#38bdf8 60%,#0ea5e9);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.login-sub{font-size:13.5px;color:rgba(243,239,228,0.45);text-align:center;margin-top:-10px}

input[type="password"]{
  width:100%;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:14px;
  color:#e8eaf0;
  font-family:'Vazirmatn',sans-serif;
  font-size:20px;
  padding:15px 16px;
  outline:none;
  text-align:center;
  letter-spacing:8px;
  transition:border-color .2s,box-shadow .2s;
  direction:ltr;
}
input[type="password"]:focus{
  border-color:rgba(56,189,248,0.75);
  box-shadow:0 0 0 3px rgba(56,189,248,0.18);
}

.btn-primary{
  width:100%;
  background:linear-gradient(135deg,#38bdf8,#0ea5e9);
  color:#062430;border:none;border-radius:999px;
  font-family:'Vazirmatn',sans-serif;
  font-size:16px;font-weight:700;
  padding:15px;cursor:pointer;
  transition:opacity .2s,transform .1s;
  box-shadow:0 8px 28px rgba(14,165,233,0.45), 0 0 0 1px rgba(255,255,255,0.08) inset;
}
.btn-primary:hover{opacity:.9}
.btn-primary:active{transform:scale(.98)}

.err{font-size:13px;color:#f87171;text-align:center;min-height:18px;transition:color .2s}

/* CHAT */
#chat-screen{
  position:relative;overflow:hidden;
  display:none;flex-direction:column;
  width:100%;max-width:580px;height:100dvh;
  background:
    linear-gradient(rgba(5,9,16,0.66), rgba(5,9,16,0.72)),
    url('chat-bg.jpg') center/cover no-repeat;
  backdrop-filter:blur(36px) saturate(150%);
  -webkit-backdrop-filter:blur(36px) saturate(150%);
  border-left:1px solid rgba(255,255,255,0.08);
  border-right:1px solid rgba(255,255,255,0.08);
}

.chat-header{
  position:relative;overflow:visible;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;
  background:rgba(56,189,248,0.07);
  backdrop-filter:blur(26px) saturate(150%);
  -webkit-backdrop-filter:blur(26px) saturate(150%);
  border-bottom:1px solid rgba(255,255,255,0.1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.14);
  flex-shrink:0;gap:10px;
}
.chat-header::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 40%);
}
.hdr-left{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.hdr-right{position:relative;z-index:1}
.hdr-logo{width:26px;height:26px;object-fit:contain;flex-shrink:0}
.avatar{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,#38bdf8,#0ea5e9);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:0 0 12px rgba(14,165,233,0.4);
  position:relative;overflow:hidden;
}
.avatar .fireball{
  position:absolute;top:50%;left:50%;width:9px;height:9px;
  margin:-4.5px 0 0 -4.5px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#fff6d0,#fbbf24 45%,#e8672e 85%);
  box-shadow:0 0 6px 2px rgba(232,103,46,0.85);
  animation:fireOrbit 2.6s linear infinite;
  z-index:1;
}
@keyframes fireOrbit{
  from{transform:rotate(0deg) translateX(12px) rotate(0deg);}
  to{transform:rotate(360deg) translateX(12px) rotate(-360deg);}
}
.avatar.b{background:linear-gradient(135deg,#0c2d4a,#155e8a)}
.avatar.b .fireball{display:none}
.avatar.b .waterfill{
  position:absolute;left:-2px;right:-2px;bottom:-2px;height:0%;
  background:linear-gradient(180deg,rgba(186,230,253,0.55),rgba(56,189,248,0.85));
  border-radius:48% 48% 0 0/60% 60% 0 0;
  animation:waterFill 4s ease-in-out infinite;
  z-index:1;
}
.avatar.b .drop{
  position:absolute;top:-8px;left:50%;width:5px;height:7px;
  background:#bae6fd;border-radius:50% 50% 50% 0;
  transform:translateX(-50%) rotate(45deg);
  animation:dropFall 4s ease-in infinite;
  z-index:1;
}
@keyframes waterFill{
  0%{height:0%;} 45%{height:75%;} 60%{height:75%;} 100%{height:0%;}
}
@keyframes dropFall{
  0%{top:-8px;opacity:1;} 38%{top:55%;opacity:1;} 42%{opacity:0;top:60%;} 100%{opacity:0;top:-8px;}
}
.hdr-info{display:flex;flex-direction:column;gap:1px}
.hdr-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.hdr-status{font-size:11.5px;color:rgba(243,239,228,0.4)}
.hdr-right{display:flex;align-items:center;gap:6px}
.icon-btn{
  background:none;border:none;color:rgba(243,239,228,0.4);
  cursor:pointer;padding:7px;border-radius:9px;font-size:17px;
  transition:color .2s,background .2s;display:flex;align-items:center;
}
.icon-btn:hover{color:#e8eaf0;background:rgba(255,255,255,0.07)}

#hdr-menu{
  display:none;flex-direction:column;
  position:absolute;top:44px;left:0;
  background:rgba(20,30,42,0.55);
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:14px;padding:6px;
  min-width:180px;z-index:60;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.14), 0 12px 34px rgba(0,0,0,0.5);
}
#hdr-menu.open{display:flex}
.menu-item{
  padding:10px 12px;border-radius:9px;font-size:13.5px;
  cursor:pointer;transition:background .15s;white-space:nowrap;
  text-align:right;
}
.menu-item:hover{background:rgba(56,189,248,0.16)}
.menu-item.danger:hover{background:rgba(248,113,113,0.16)}

#messages{
  flex:1;overflow-y:auto;
  padding:16px 14px;
  display:flex;flex-direction:column;gap:4px;
  scroll-behavior:smooth;
}
#messages::-webkit-scrollbar{width:3px}
#messages::-webkit-scrollbar-thumb{background:rgba(56,189,248,0.25);border-radius:3px}

.msg-wrap{display:flex;flex-direction:column;max-width:72%}
.msg-wrap.me{align-self:flex-start;align-items:flex-start}
.msg-wrap.them{align-self:flex-end;align-items:flex-end}

.bubble{
  position:relative;overflow:hidden;
  padding:10px 14px;border-radius:19px;
  font-size:14.5px;line-height:1.65;
  word-break:break-word;white-space:pre-wrap;
  box-shadow:0 3px 10px rgba(0,0,0,0.18);
}
.bubble::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(160deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 45%);
}
.msg-wrap.me .bubble{
  background:rgba(56,189,248,0.24);
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  border:1px solid rgba(56,189,248,0.4);
  border-bottom-right-radius:5px;
}
.msg-wrap.them .bubble{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  border:1px solid rgba(255,255,255,0.14);
  border-bottom-left-radius:5px;
}
.msg-wrap:last-child .bubble{
  animation:bubblePop .38s cubic-bezier(.34,1.56,.64,1);
}
@keyframes bubblePop{
  0%{transform:scale(.6);opacity:0;}
  70%{transform:scale(1.04);opacity:1;}
  100%{transform:scale(1);}
}
.msg-meta{font-size:11px;color:rgba(243,239,228,0.28);margin-top:3px;padding:0 3px}

.date-sep{
  align-self:center;font-size:11.5px;
  color:rgba(243,239,228,0.3);
  background:rgba(56,189,248,0.08);
  backdrop-filter:blur(10px);
  border:1px solid rgba(56,189,248,0.18);
  border-radius:20px;padding:3px 14px;
  margin:8px 0;
}

.sticker-bubble{
  background:none!important;border:none!important;
  box-shadow:none!important;backdrop-filter:none!important;
  font-size:52px;line-height:1.2;padding:4px 8px!important;
}
.sticker-bubble::before{display:none}

.msg-text{display:block}
.in-bubble-meta{
  display:flex;justify-content:flex-end;
  font-size:10.5px;opacity:.55;margin-top:3px;white-space:nowrap;
}
.sticker-bubble .in-bubble-meta{padding:0 4px}

.reply-quote{
  border-right:3px solid rgba(255,255,255,0.35);
  background:rgba(255,255,255,0.07);
  border-radius:8px;
  padding:5px 8px;margin-bottom:6px;
  max-width:100%;
}
.msg-wrap.me .reply-quote{border-right-color:rgba(255,255,255,0.5)}
.reply-quote-who{font-size:11px;font-weight:700;opacity:.8;margin-bottom:1px}
.reply-quote-text{font-size:12px;opacity:.65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#msg-menu{
  display:none;flex-direction:column;
  position:fixed;
  background:rgba(20,30,42,0.55);
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:14px;padding:6px;
  min-width:170px;z-index:120;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.14), 0 12px 34px rgba(0,0,0,0.5);
}
#msg-menu.open{display:flex}
#msg-menu .menu-item{text-align:right}

#reply-bar{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;
  background:rgba(56,189,248,0.08);
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  border-top:1px solid rgba(255,255,255,0.1);
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.reply-bar-text{flex:1;overflow:hidden;font-size:12.5px}
.reply-bar-who{font-weight:700;color:#7dd3fc}
.reply-bar-snip{opacity:.6;margin-inline-start:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-bar-x{
  background:rgba(255,255,255,0.08);border:none;color:#e8eaf0;
  width:24px;height:24px;border-radius:50%;cursor:pointer;flex-shrink:0;
  font-size:12px;
}

.edit-textarea{
  width:100%;min-width:160px;background:rgba(0,0,0,0.25);
  border:1px solid rgba(255,255,255,0.2);border-radius:10px;
  color:#e8eaf0;font-family:'Vazirmatn',sans-serif;font-size:14px;
  padding:8px 10px;outline:none;resize:none;min-height:44px;
}
.edit-actions{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}
.edit-save,.edit-cancel{
  border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;
  font-family:'Vazirmatn',sans-serif;
}
.edit-save{background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#062430;font-weight:700}
.edit-cancel{background:rgba(255,255,255,0.1);color:#e8eaf0}

#toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);
  background:rgba(20,30,42,0.75);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:999px;padding:8px 18px;font-size:12.5px;color:#e8eaf0;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  z-index:300;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.chat-input{
  display:flex;align-items:flex-end;gap:8px;
  padding:10px 12px;
  background:rgba(56,189,248,0.05);
  backdrop-filter:blur(26px) saturate(150%);
  -webkit-backdrop-filter:blur(26px) saturate(150%);
  border-top:1px solid rgba(255,255,255,0.1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.12);
  flex-shrink:0;position:relative;overflow:visible;
}
.chat-input::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(340deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 45%);
}

#msg-input{
  flex:1;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;
  color:#e8eaf0;
  font-family:'Vazirmatn',sans-serif;
  font-size:14px;
  padding:10px 13px;
  resize:none;outline:none;
  max-height:110px;overflow-y:auto;
  line-height:1.5;
  transition:border-color .2s;
  direction:rtl;
}
#msg-input:focus{border-color:rgba(56,189,248,0.55)}
#msg-input::placeholder{color:rgba(243,239,228,0.28)}

.send-btn{
  background:linear-gradient(135deg,#38bdf8,#0ea5e9);
  border:none;border-radius:12px;color:#062430;cursor:pointer;
  width:40px;height:40px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;
  box-shadow:0 2px 12px rgba(14,165,233,0.4);
  transition:opacity .2s,transform .1s;
}
.send-btn:hover{opacity:.88}
.send-btn:active{transform:scale(.95)}

#sticker-panel{
  position:absolute;bottom:68px;right:12px;
  background:rgba(20,30,42,0.45);
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:16px;padding:12px;
  display:none;flex-wrap:wrap;gap:6px;
  width:240px;z-index:50;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.14), 0 12px 34px rgba(0,0,0,0.5);
}
#sticker-panel.open{display:flex}
.stk{
  font-size:30px;cursor:pointer;padding:5px;
  border-radius:8px;transition:background .15s,transform .1s;
  line-height:1;
}
.stk:hover{background:rgba(56,189,248,0.16);transform:scale(1.2)}
img.emoji{height:1.15em;width:1.15em;vertical-align:-0.2em;margin:0 1px}
.sticker-bubble img.emoji{height:44px;width:44px;vertical-align:middle;margin:0}
.stk img.emoji{height:26px;width:26px}

#quick-panel{
  position:absolute;bottom:68px;right:56px;
  background:rgba(20,30,42,0.45);
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:16px;padding:10px;
  display:none;flex-direction:column;gap:6px;
  width:230px;z-index:50;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.14), 0 12px 34px rgba(0,0,0,0.5);
}
#quick-panel.open{display:flex}
.quick-item{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:10px;color:#f3efe4;
  font-family:'Vazirmatn',sans-serif;
  font-size:13px;text-align:right;
  padding:9px 11px;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.quick-item:hover{background:rgba(56,189,248,0.18);border-color:rgba(56,189,248,0.4)}

.send-btn.sending{animation:sendPulse .45s ease;}
@keyframes sendPulse{
  0%{transform:scale(1);}
  35%{transform:scale(.8) rotate(-8deg);}
  60%{transform:scale(1.18) rotate(4deg);box-shadow:0 0 0 8px rgba(14,165,233,0.25);}
  100%{transform:scale(1) rotate(0);box-shadow:0 2px 12px rgba(14,165,233,0.4);}
}

.dot-online{
  width:8px;height:8px;border-radius:50%;
  background:#22c55e;display:inline-block;
  box-shadow:0 0 6px #22c55e;margin-left:4px;
}

#cfg-modal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.65);
  backdrop-filter:blur(6px);
  z-index:200;align-items:center;justify-content:center;
}
#cfg-modal.open{display:flex}
.modal-box{
  background:rgba(20,30,42,0.55);
  backdrop-filter:blur(30px) saturate(160%);
  -webkit-backdrop-filter:blur(30px) saturate(160%);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:20px;padding:28px 22px;
  width:92%;max-width:360px;
  display:flex;flex-direction:column;gap:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.14), 0 20px 60px rgba(0,0,0,0.5);
}
.modal-title{font-size:16px;font-weight:700}
.modal-desc{font-size:12.5px;color:rgba(243,239,228,0.4);line-height:1.7}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:rgba(243,239,228,0.4)}
.field input{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;color:#e8eaf0;
  font-family:'Vazirmatn',sans-serif;
  font-size:13px;padding:9px 12px;outline:none;
  transition:border-color .2s;direction:ltr;
}
.field input:focus{border-color:rgba(56,189,248,0.5)}
.modal-btns{display:flex;gap:10px;margin-top:4px}
.btn-cancel{
  flex:1;background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;color:#e8eaf0;
  font-family:'Vazirmatn',sans-serif;
  font-size:14px;padding:10px;cursor:pointer;
}
.btn-cancel:hover{background:rgba(255,255,255,0.09)}
.btn-save{flex:2}
.btn-test{
  margin-top:2px;background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:10px;color:#e8eaf0;
  font-family:'Vazirmatn',sans-serif;
  font-size:13px;padding:10px;cursor:pointer;
}
.btn-test:hover{background:rgba(56,189,248,0.16);border-color:rgba(56,189,248,0.4)}

#lightbox{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.9);z-index:300;
  align-items:center;justify-content:center;
}
#lightbox.open{display:flex}
#lightbox img{max-width:92vw;max-height:90vh;border-radius:10px}
#lb-close{
  position:absolute;top:16px;left:16px;
  background:rgba(255,255,255,0.1);border:none;
  color:#e8eaf0;font-size:20px;cursor:pointer;
  border-radius:8px;padding:5px 11px;
}

.n-dot{
  width:9px;height:9px;border-radius:50%;
  background:#0ea5e9;box-shadow:0 0 8px #0ea5e9;
  display:none;
}

@media(max-width:580px){
  #chat-screen{border:none}
  .msg-wrap{max-width:82%}
}
</style>
</head>
<body>

<div id="login-screen" class="glass">
  <div class="logo-wrap"><img src="logo.png" alt="KokiChat"></div>
  <div class="login-title">KokiChat</div>
  <div class="login-sub">فضای خصوصی گفتگو</div>
  <input type="password" id="pwd" placeholder="••••••" autocomplete="off" />
  <div class="err" id="err"></div>
  <button class="btn-primary" id="login-btn">ورود</button>
</div>

<div id="chat-screen">
  <div class="chat-header">
    <div class="hdr-left">
      <div class="avatar" id="my-av"><span class="fireball"></span><span class="waterfill"></span><span class="drop"></span></div>
      <div class="hdr-info">
        <div class="hdr-name"><img class="hdr-logo" src="logo.png" alt=""> KokiChat 🔐</div>
        <div class="hdr-status" id="status-txt">در حال اتصال...</div>
      </div>
    </div>
    <div class="hdr-right">
      <div class="n-dot" id="ndot"></div>
      <button class="icon-btn" onclick="toggleMenu()">☰</button>
      <div id="hdr-menu">
        <div class="menu-item" onclick="toggleMenu(false);openCfg()">⚙️ تنظیمات اعلان</div>
        <div class="menu-item" onclick="toggleMenu(false);confirmClearHistory()">🗑️ حذف تاریخچه</div>
        <div class="menu-item danger" onclick="toggleMenu(false);doLogout()">🚪 خروج</div>
      </div>
    </div>
  </div>

  <div id="messages"></div>

  <div class="chat-input">
    <div id="sticker-panel"></div>
    <div id="quick-panel"></div>
    <button class="icon-btn" onclick="toggleQuick()" style="flex-shrink:0;font-size:19px">📋</button>
    <button class="icon-btn" onclick="toggleStk()" style="flex-shrink:0;font-size:20px">😊</button>
    <textarea id="msg-input" rows="1" placeholder="پیام بده..."
      onkeydown="onKey(event)" oninput="grow(this)"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMsg()">➤</button>
  </div>
</div>

<div id="cfg-modal">
  <div class="modal-box">
    <div class="modal-title">🔔 اعلان بله</div>
    <div class="modal-desc">توکن ربات بله و Chat ID خودت رو وارد کن. فقط تو مرورگرت ذخیره می‌شه.</div>
    <div class="field">
      <label>توکن ربات بله</label>
      <input type="text" id="cfg-token" placeholder="توکن ربات" />
    </div>
    <div class="field">
      <label>Chat ID بله</label>
      <input type="text" id="cfg-chatid" placeholder="شناسه چت" />
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeCfg()">انصراف</button>
      <button class="btn-primary btn-save" onclick="saveCfg()">ذخیره</button>
    </div>
    <button class="btn-test" onclick="testCfg()">🧪 ارسال پیام تست</button>
  </div>
</div>

<div id="lightbox">
  <button id="lb-close" onclick="closeLb()">✕</button>
  <img id="lb-img" src="" />
</div>

<div id="msg-menu"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/twemoji.min.js" crossorigin="anonymous"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// اطلاعات پروژه‌ی Supabase
const SUPABASE_URL      = "https://spliizlxeouevrjrgtwy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_O1-F6Pfaw0Vvm6h9o2tGnw_CbRqOwR9";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ⚠️ یه رمز برای هرکدوم — چون فقط یه فیلد رمز داریم، خود رمز مشخص می‌کنه کی وارد شده
// رمز کوکمال رو خودت گفتی؛ رمز خودت (koki) رو اینجا با یه رمز دلخواه عوض کن
const PASSWORDS = {
  kokmal: "kokmal",
  koki:   "koki"
};
const ALLOWED   = Object.keys(PASSWORDS);
const FRIEND_ID = "kokmal";

const STICKERS = [
  "😂","😍","🥰","😎","🤣","😭","🙏","👍","❤️","🔥",
  "😅","🤩","😜","🥳","😊","💪","🤦","🙈","💀","✅",
  "🌹","🎉","👏","💯","😇","🤗","🤔","😴","👀","😋"
];

const QUICK_PHRASES = [
  "دوست عزیز بیا اینور",
  "دستم بنده خودم میام اونور",
  "یه چیزی خش نداری بخوریم؟؟"
];

let me, lastDate, unread = false, stkOpen = false, quickOpen = false, msgCache = [], heartbeatId;

function parseEmoji(root) {
  if (window.twemoji) twemoji.parse(root, { folder: 'svg', ext: '.svg' });
}

// stickers
const sp = document.getElementById('sticker-panel');
STICKERS.forEach(s => {
  const b = document.createElement('span');
  b.className = 'stk'; b.textContent = s;
  b.onclick = () => { sendStk(s); toggleStk(false); };
  sp.appendChild(b);
});
parseEmoji(sp);

// quick phrases
const qp = document.getElementById('quick-panel');
QUICK_PHRASES.forEach(p => {
  const b = document.createElement('div');
  b.className = 'quick-item'; b.textContent = p;
  b.onclick = () => { sendQuick(p); toggleQuick(false); };
  qp.appendChild(b);
});
parseEmoji(document.body);

// LOGIN
function doLogin() {
  const val = document.getElementById('pwd').value;
  const match = Object.entries(PASSWORDS).find(([id, pw]) => pw === val);
  if (match) {
    pickName(match[0]);
  } else {
    const e = document.getElementById('err');
    e.textContent = 'رمز اشتباهه!';
    document.getElementById('pwd').value = '';
    setTimeout(() => e.textContent = '', 2000);
  }
}
document.getElementById('login-btn').onclick = doLogin;
document.getElementById('pwd').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function pickName(name) {
  me = name;
  document.getElementById('login-screen').style.display  = 'none';
  document.getElementById('chat-screen').style.display   = 'flex';
  if (name === FRIEND_ID) document.getElementById('my-av').classList.add('b');
  initChat();
}

async function initChat() {
  const other = ALLOWED.find(u => u !== me);

  // --- presence ---
  async function pingPresence(online) {
    await supabase.from('presence').upsert({ name: me, online, ts: Date.now() });
  }
  await pingPresence(true);
  heartbeatId = setInterval(() => pingPresence(true), 15000);
  window.addEventListener('beforeunload', () => { navigator.sendBeacon && pingPresence(false); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pingPresence(true); });

  function paintPresence(d) {
    const el = document.getElementById('status-txt');
    if (!d) { el.textContent = `${other} آفلاینه`; return; }
    const fresh = Date.now() - d.ts < 30000;
    if (d.online && fresh) el.innerHTML = `<span class="dot-online"></span> ${other} آنلاینه`;
    else if (d.ts) el.textContent = `${other} — ${ago(d.ts)}`;
    else el.textContent = `${other} آفلاینه`;
  }

  const { data: presRow } = await supabase.from('presence').select('*').eq('name', other).maybeSingle();
  paintPresence(presRow);
  setInterval(async () => {
    const { data } = await supabase.from('presence').select('*').eq('name', other).maybeSingle();
    paintPresence(data);
  }, 10000);

  supabase.channel('presence-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'presence', filter: `name=eq.${other}` },
      payload => paintPresence(payload.new))
    .subscribe();

  // --- messages ---
  const { data: initialMsgs } = await supabase.from('messages').select('*').order('ts', { ascending: true });
  msgCache = initialMsgs || [];
  renderAll(msgCache);

  supabase.channel('messages-changes')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      if (!msgCache.some(x => x.id === payload.new.id)) msgCache.push(payload.new);
      renderAll(msgCache);
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, payload => {
      const idx = msgCache.findIndex(x => x.id === payload.new.id);
      if (idx > -1) msgCache[idx] = payload.new;
      renderAll(msgCache);
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, payload => {
      msgCache = msgCache.filter(x => x.id !== payload.old.id);
      renderAll(msgCache);
    })
    .subscribe();
}

function renderAll(msgs) {
  const c = document.getElementById('messages');
  const atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 80;
  c.innerHTML = ''; lastDate = null;
  [...msgs].sort((a,b) => a.ts - b.ts).forEach(renderOne);
  parseEmoji(c);
  if (atBottom) c.scrollTop = c.scrollHeight;
}

function buildInlineMeta(m, isMe) {
  const meta = document.createElement('div');
  meta.className = 'in-bubble-meta';
  const t = new Date(m.ts || Date.now());
  const hh = t.getHours().toString().padStart(2,'0');
  const mm = t.getMinutes().toString().padStart(2,'0');
  let str = (isMe ? '' : m.sender + ' · ') + hh + ':' + mm;
  if (m.edited) str += ' · ویرایش شد';
  meta.textContent = str;
  return meta;
}

function buildReplyQuote(rt) {
  const rq = document.createElement('div');
  rq.className = 'reply-quote';
  const who = document.createElement('div');
  who.className = 'reply-quote-who';
  who.textContent = rt.sender === me ? 'خودت' : rt.sender;
  const txt = document.createElement('div');
  txt.className = 'reply-quote-text';
  txt.textContent = rt.type === 'sticker' ? rt.text + ' (استیکر)' : rt.text;
  rq.appendChild(who); rq.appendChild(txt);
  return rq;
}

function renderOne(m) {
  const c = document.getElementById('messages');
  const isMe = m.sender === me;

  if (m.ts) {
    const dk = new Date(m.ts).toDateString();
    if (dk !== lastDate) {
      lastDate = dk;
      const sep = document.createElement('div');
      sep.className = 'date-sep';
      sep.textContent = fmtDate(new Date(m.ts));
      c.appendChild(sep);
    }
  }

  const wrap = document.createElement('div');
  wrap.className = `msg-wrap ${isMe ? 'me' : 'them'}`;

  const bub = document.createElement('div');
  let menuable = true;

  if (m.type === 'sticker') {
    bub.className = 'bubble sticker-bubble';
    if (m.reply_to) bub.appendChild(buildReplyQuote(m.reply_to));
    const txt = document.createElement('div');
    txt.textContent = m.text;
    bub.appendChild(txt);
    bub.appendChild(buildInlineMeta(m, isMe));
  } else if (m.type === 'image') {
    bub.className = 'bubble'; bub.style.padding = '6px';
    menuable = false;
    if (m.reply_to) bub.appendChild(buildReplyQuote(m.reply_to));
    const img = document.createElement('img');
    img.src = m.url;
    img.style.cssText = 'max-width:200px;border-radius:10px;display:block;cursor:pointer';
    img.loading = 'lazy';
    img.onclick = (e) => { e.stopPropagation(); openLb(m.url); };
    bub.appendChild(img);
    const metaWrap = document.createElement('div');
    metaWrap.style.padding = '4px 6px 0';
    metaWrap.appendChild(buildInlineMeta(m, isMe));
    bub.appendChild(metaWrap);
  } else {
    bub.className = 'bubble';
    if (m.reply_to) bub.appendChild(buildReplyQuote(m.reply_to));
    const txt = document.createElement('span');
    txt.className = 'msg-text';
    txt.textContent = m.text;
    bub.appendChild(txt);
    bub.appendChild(buildInlineMeta(m, isMe));
  }

  if (menuable) {
    bub.style.cursor = 'pointer';
    bub.onclick = (e) => {
      if (bub.dataset.editing === '1') return;
      e.stopPropagation();
      openMsgMenu(m, bub, isMe);
    };
  }

  wrap.appendChild(bub);
  c.appendChild(wrap);

  if (!isMe && m.ts && Date.now() - m.ts < 6000 && document.hidden) {
    document.title = '💬 پیام جدید!';
    unread = true;
    document.getElementById('ndot').style.display = 'block';
    sendBale(`💬 پیام از ${m.sender}:\n${m.type==='sticker' ? m.text+' (استیکر)' : (m.text||'').slice(0,80)}`);
  }
}

let replyingTo = null;

async function sendMsg() {
  if (!me) return;
  const inp = document.getElementById('msg-input');
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = ''; inp.style.height = 'auto';
  bounceSend();
  const payload = { sender: me, type: 'text', text: txt, ts: Date.now() };
  if (replyingTo) { payload.reply_to = replyingTo; cancelReply(); }
  await supabase.from('messages').insert(payload);
  if (me === FRIEND_ID) sendBale(`💬 پیام:\n${txt.slice(0,100)}`);
}
window.sendMsg = sendMsg;

function bounceSend() {
  const btn = document.getElementById('send-btn');
  btn.classList.remove('sending');
  void btn.offsetWidth;
  btn.classList.add('sending');
}

async function sendStk(s) {
  if (!me) return;
  bounceSend();
  const payload = { sender: me, type: 'sticker', text: s, ts: Date.now() };
  if (replyingTo) { payload.reply_to = replyingTo; cancelReply(); }
  await supabase.from('messages').insert(payload);
  if (me === FRIEND_ID) sendBale(`${s} استیکر`);
}

async function sendQuick(text) {
  if (!me) return;
  bounceSend();
  const payload = { sender: me, type: 'text', text, ts: Date.now() };
  if (replyingTo) { payload.reply_to = replyingTo; cancelReply(); }
  await supabase.from('messages').insert(payload);
  if (me === FRIEND_ID) sendBale(`💬 پیام:\n${text.slice(0,100)}`);
}

// --- message actions: menu, copy, share, edit, reply ---
function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1600);
}

function openMsgMenu(m, bubEl, isMe) {
  const menu = document.getElementById('msg-menu');
  menu.innerHTML = '';
  const items = [];
  items.push(['📤 اشتراک‌گذاری', () => shareMsg(m)]);
  items.push(['📋 کپی', () => copyMsg(m)]);
  if (isMe && m.type === 'text') items.push(['✏️ ویرایش', () => startEdit(m, bubEl)]);
  items.push(['↩️ پاسخ', () => startReply(m)]);
  items.forEach(([label, fn]) => {
    const it = document.createElement('div');
    it.className = 'menu-item';
    it.textContent = label;
    it.onclick = (e) => { e.stopPropagation(); closeMsgMenu(); fn(); };
    menu.appendChild(it);
  });
  const r = bubEl.getBoundingClientRect();
  menu.classList.add('open');
  const menuW = menu.offsetWidth || 170;
  let left = r.left;
  if (left + menuW > window.innerWidth - 8) left = window.innerWidth - menuW - 8;
  if (left < 8) left = 8;
  let top = r.bottom + 6;
  if (top + 180 > window.innerHeight) top = r.top - 186;
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
}
window.closeMsgMenu = () => document.getElementById('msg-menu').classList.remove('open');

async function copyMsg(m) {
  try { await navigator.clipboard.writeText(m.text || ''); toast('کپی شد'); }
  catch { toast('کپی نشد'); }
}
async function shareMsg(m) {
  if (navigator.share) {
    try { await navigator.share({ text: m.text || '' }); } catch {}
  } else {
    copyMsg(m);
    toast('اشتراک‌گذاری پشتیبانی نمی‌شه؛ متن کپی شد');
  }
}

function startEdit(m, bubEl) {
  bubEl.dataset.editing = '1';
  bubEl.innerHTML = '';
  const ta = document.createElement('textarea');
  ta.className = 'edit-textarea';
  ta.value = m.text || '';
  ta.onclick = e => e.stopPropagation();
  const row = document.createElement('div');
  row.className = 'edit-actions';
  const save = document.createElement('button');
  save.className = 'edit-save'; save.textContent = 'ذخیره';
  const cancel = document.createElement('button');
  cancel.className = 'edit-cancel'; cancel.textContent = 'لغو';
  row.appendChild(save); row.appendChild(cancel);
  bubEl.appendChild(ta); bubEl.appendChild(row);
  ta.focus();

  cancel.onclick = (e) => { e.stopPropagation(); renderAll(msgCache); };
  save.onclick = async (e) => {
    e.stopPropagation();
    const newText = ta.value.trim();
    if (!newText) return;
    await supabase.from('messages').update({ text: newText, edited: true }).eq('id', m.id);
    const idx = msgCache.findIndex(x => x.id === m.id);
    if (idx > -1) { msgCache[idx] = { ...msgCache[idx], text: newText, edited: true }; }
    renderAll(msgCache);
  };
}

function startReply(m) {
  replyingTo = { id: m.id, sender: m.sender, type: m.type, text: m.type === 'sticker' ? m.text : (m.text || '').slice(0, 120) };
  renderReplyBar();
  document.getElementById('msg-input').focus();
}
function renderReplyBar() {
  let bar = document.getElementById('reply-bar');
  if (!replyingTo) { if (bar) bar.remove(); return; }
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'reply-bar';
    document.querySelector('.chat-input').insertAdjacentElement('beforebegin', bar);
  }
  bar.innerHTML = '';
  const txt = document.createElement('div'); txt.className = 'reply-bar-text';
  const who = document.createElement('span'); who.className = 'reply-bar-who';
  who.textContent = (replyingTo.sender === me ? 'خودت' : replyingTo.sender) + ': ';
  const snip = document.createElement('span'); snip.className = 'reply-bar-snip';
  snip.textContent = replyingTo.type === 'sticker' ? replyingTo.text + ' (استیکر)' : replyingTo.text;
  txt.appendChild(who); txt.appendChild(snip);
  const x = document.createElement('button'); x.className = 'reply-bar-x'; x.textContent = '✕';
  x.onclick = () => cancelReply();
  bar.appendChild(txt); bar.appendChild(x);
}
window.cancelReply = () => { replyingTo = null; renderReplyBar(); };

async function sendBale(text) {
  const cfg = loadCfg();
  if (!cfg?.token || !cfg?.chatId) { return { ok: false, info: 'تنظیمات خالیه' }; }
  // توجه: سرور بله به مرورگر اجازه‌ی خوندن جواب رو نمی‌ده (CORS)، برای همین با GET
  // و حالت no-cors می‌فرستیم — درخواست واقعاً می‌ره، ولی نمی‌تونیم از اینجا تأیید بگیریم.
  const url = `https://tapi.bale.ai/bot${cfg.token}/sendMessage`
    + `?chat_id=${encodeURIComponent(cfg.chatId)}&text=${encodeURIComponent(text)}`;
  try {
    await fetch(url, { method: 'GET', mode: 'no-cors' });
    return { ok: true, info: 'درخواست فرستاده شد (بدون تأیید، چون بله CORS رو می‌بنده)' };
  } catch(e) {
    const info = 'خطای شبکه: ' + (e?.message || e);
    console.error('Bale fetch failed:', e);
    toast('❌ ' + info);
    return { ok: false, info };
  }
}

function loadCfg() { try { return JSON.parse(localStorage.getItem('koki_bale')||'null'); } catch { return null; } }

window.openCfg = () => {
  const c = loadCfg();
  if (c) { document.getElementById('cfg-token').value = c.token||''; document.getElementById('cfg-chatid').value = c.chatId||''; }
  document.getElementById('cfg-modal').classList.add('open');
};
window.closeCfg = () => document.getElementById('cfg-modal').classList.remove('open');
window.saveCfg = () => {
  localStorage.setItem('koki_bale', JSON.stringify({
    token: document.getElementById('cfg-token').value.trim(),
    chatId: document.getElementById('cfg-chatid').value.trim()
  }));
  toast('ذخیره شد');
  closeCfg();
};
window.testCfg = async () => {
  const token = document.getElementById('cfg-token').value.trim();
  const chatId = document.getElementById('cfg-chatid').value.trim();
  if (!token || !chatId) { toast('❌ اول توکن و شناسه رو پر کن'); return; }
  localStorage.setItem('koki_bale', JSON.stringify({ token, chatId }));
  toast('در حال ارسال...');
  const r = await sendBale('✅ پیام تست از KokiChat');
  if (r.ok) setTimeout(() => toast('فرستاده شد — الان اپ بله رو چک کن 👀'), 1700);
};

let menuOpen = false;
window.toggleMenu = (force) => {
  menuOpen = force !== undefined ? force : !menuOpen;
  document.getElementById('hdr-menu').classList.toggle('open', menuOpen);
};
window.toggleStk = (force) => {
  stkOpen = force !== undefined ? force : !stkOpen;
  document.getElementById('sticker-panel').classList.toggle('open', stkOpen);
  if (stkOpen) toggleQuick(false);
};
window.toggleQuick = (force) => {
  quickOpen = force !== undefined ? force : !quickOpen;
  document.getElementById('quick-panel').classList.toggle('open', quickOpen);
  if (quickOpen) toggleStk(false);
};
document.addEventListener('click', e => {
  if (stkOpen && !e.target.closest('#sticker-panel') && !e.target.closest('.icon-btn')) toggleStk(false);
  if (quickOpen && !e.target.closest('#quick-panel') && !e.target.closest('.icon-btn')) toggleQuick(false);
  if (menuOpen && !e.target.closest('#hdr-menu') && !e.target.closest('.icon-btn')) toggleMenu(false);
  if (!e.target.closest('#msg-menu')) closeMsgMenu();
});

window.confirmClearHistory = async () => {
  if (!confirm('همه‌ی پیام‌ها برای همیشه پاک بشن؟')) return;
  await supabase.from('messages').delete().gt('id', 0);
  msgCache = [];
  renderAll(msgCache);
};

window.onKey  = e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} };
window.grow   = el => { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,110)+'px'; };
window.doLogout = async () => {
  if (!confirm('خروج؟')) return;
  if (heartbeatId) clearInterval(heartbeatId);
  if (me) await supabase.from('presence').upsert({ name: me, online: false, ts: Date.now() });
  location.reload();
};
window.openLb = src => { document.getElementById('lb-img').src=src; document.getElementById('lightbox').classList.add('open'); };
window.closeLb = () => document.getElementById('lightbox').classList.remove('open');
document.getElementById('lightbox').onclick = e => { if(e.target===document.getElementById('lightbox')) closeLb(); };

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && unread) { document.title='KokiChat'; unread=false; document.getElementById('ndot').style.display='none'; }
});

function fmtDate(d) {
  const now = new Date();
  if (d.toDateString()===now.toDateString()) return 'امروز';
  const y = new Date(now); y.setDate(now.getDate()-1);
  if (d.toDateString()===y.toDateString()) return 'دیروز';
  return d.toLocaleDateString('fa-IR');
}
function ago(ts) {
  const s = Date.now()-ts;
  if(s<60000) return 'همین الان';
  if(s<3600000) return Math.floor(s/60000)+' دقیقه پیش';
  if(s<86400000) return Math.floor(s/3600000)+' ساعت پیش';
  return Math.floor(s/86400000)+' روز پیش';
}
